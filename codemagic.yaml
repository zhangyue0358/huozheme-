workflows:
  ios-testflight-ipa:
    name: iOS TestFlight IPA (EAS local)
    instance_type: mac_mini_m2
    max_build_duration: 120
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: codemagic/ios-build-20-20260920
          include: true
          source: true
    environment:
      groups:
        - expo_credentials
      node: 22
      xcode: 26.5
      cocoapods: default
    scripts:
      - name: Install dependencies and type-check app
        script: |
          npm ci
          npm run typecheck
      - name: Build signed iOS IPA using existing Expo credentials
        script: |
          : "${EXPO_TOKEN:?Add EXPO_TOKEN as a secret in the expo_credentials group}"
          npm install --global eas-cli
          mkdir -p build/ios
          eas build --platform ios --profile production --local --non-interactive --output "$CM_BUILD_DIR/build/ios/zaifou.ipa"
    artifacts:
      - build/ios/*.ipa
